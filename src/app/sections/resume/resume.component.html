<div class="resume-page">
  <div class="resume-toolbar">
    <a routerLink="/" class="btn btn-outline btn-sm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Back to Portfolio
    </a>
    <span class="resume-toolbar__title">Resume</span>
    <a [href]="driveUrl" target="_blank" rel="noopener" class="btn btn-sm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open Resume
    </a>
  </div>
  <div class="resume-redirect">
    <p>Opening your resume in Google Drive…</p>
    <a [href]="driveUrl" target="_blank" rel="noopener" class="btn">Click here if it didn't open</a>
  </div>
</div>
