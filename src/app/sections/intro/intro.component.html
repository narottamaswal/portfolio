<section id="about">
  <div class="intro-layout reveal" appScrollReveal>
    <div class="intro-text">
      <h1 class="intro-name">
        <span class="name-accent">{{ personal.name.split(' ')[0] }}</span>
        {{ personal.name.split(' ').slice(1).join(' ') }}
      </h1>
      <h2 class="intro-title">{{ personal.title }}</h2>
      <p class="intro-summary">{{ personal.summary }}</p>
      <div class="intro-actions">
        <!-- LinkedIn -->
        <a [href]="personal.linkedin" target="_blank" class="btn btn-linkedin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </a>
        <!-- GitHub -->
        <a [href]="personal.github" target="_blank" class="btn btn-github">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <!-- LeetCode -->
        <a *ngIf="personal.leetcode" [href]="personal.leetcode" target="_blank" rel="noopener" class="btn btn-leetcode">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.2 2.5a1.2 1.2 0 0 1 1.7 0l6.1 6.1a1.2 1.2 0 0 1 0 1.7l-6.1 6.1a1.2 1.2 0 1 1-1.7-1.7l4-4H8.3a1.2 1.2 0 1 1 0-2.4h9.9l-4-4a1.2 1.2 0 0 1 0-1.8z"/><path d="M9.5 5.2a1.2 1.2 0 0 1 0 1.7L4.4 12l5.1 5.1a1.2 1.2 0 0 1-1.7 1.7L1.9 13a1.4 1.4 0 0 1 0-2l5.9-5.8a1.2 1.2 0 0 1 1.7 0z"/></svg>
          LeetCode
        </a>
        <!-- Download CV -->
        <a *ngIf="personal.cvUrl" [href]="personal.cvUrl" download="Narottam_Aswal_CV" class="btn btn-cv">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download CV
        </a>
      </div>
    </div>

    <!-- Carousel -->
    <div class="intro-carousel" *ngIf="carouselImages.length">
      <div class="carousel-track">
        <img
          *ngFor="let img of carouselImages; let i = index"
          [src]="img"
          [class.active]="i === currentIndex"
          alt="Hero image {{ i + 1 }}"
          class="carousel-slide"
        />
      </div>
      <!-- Dot indicators -->
      <div class="carousel-dots" *ngIf="carouselImages.length > 1">
        <button
          *ngFor="let img of carouselImages; let i = index"
          class="dot"
          [class.active]="i === currentIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'Go to slide ' + (i + 1)"
        ></button>
      </div>
    </div>
  </div>
</section>
