<section id="notes" class="alt-bg">
  <div class="section-container">
    <h2 class="section-title">Notes &amp; Writing</h2>
    <p class="notes-intro">Occasional writing on engineering, systems, and things I've learned on the job.</p>
    <div class="notes-list">
      <div class="note-item reveal" appScrollReveal *ngFor="let note of notes">
        <div class="note-header">
          <div class="note-left">
            <div class="note-title-row">
              <!-- Medium logo badge for linked articles -->
              <span *ngIf="note.link" class="medium-badge" title="Published on Medium">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/>
                </svg>
              </span>
              <a *ngIf="note.link" [href]="note.link" target="_blank" class="note-title">{{ note.title }}</a>
              <span *ngIf="!note.link" class="note-title-plain">{{ note.title }}</span>
            </div>
            <p class="note-summary">{{ note.summary }}</p>
          </div>
          <div class="note-meta">
            <span class="note-date">{{ note.date }}</span>
            <div class="note-tags">
              <span class="chip chip-blue" *ngFor="let tag of note.tags">{{ tag }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
